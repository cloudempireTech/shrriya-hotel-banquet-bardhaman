<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE29F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#044e46" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#tealGrad)" stroke="url(#goldGrad)" stroke-width="10" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Royal Floral Crest Elements -->
  <!-- Top Crown / Chandelier Motif -->
  <path d="M256 95 L270 125 L256 120 L242 125 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="85" r="7" fill="url(#goldGrad)" filter="url(#glow)" />
  
  <path d="M220 120 C235 105, 277 105, 292 120 C275 135, 237 135, 220 120 Z" fill="url(#goldGrad)" />

  <!-- Regal Monogram 'S' -->
  <text x="256" y="300" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-weight="700" font-size="190" fill="url(#goldGrad)" filter="url(#glow)">S</text>

  <!-- Bottom Filigree Arc -->
  <path d="M160 350 C210 390, 302 390, 352 350 C322 375, 190 375, 160 350 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="378" r="5" fill="url(#goldGrad)" />

  <!-- Text Arc SHRRIYA -->
  <text x="256" y="420" text-anchor="middle" font-family="'Cinzel', 'Montserrat', 'Helvetica', sans-serif" font-weight="700" font-size="34" letter-spacing="8" fill="#FFFFFF">SHRRIYA</text>
  <text x="256" y="450" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="600" font-size="16" letter-spacing="4" fill="url(#goldGrad)">HOTEL &amp; BANQUET</text>
</svg>